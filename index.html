<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>名片 AR · ArUco</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font: 14px/1.5 -apple-system, "Helvetica Neue", "PingFang TC", sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      /* #stage 保持相機串流原始比例，video 與 overlay 一起被同樣的 scale 裁切。 */
      #stage {
        position: fixed;
        top: 50%;
        left: 50%;
        transform-origin: center center;
        transform: translate(-50%, -50%);
      }
      #video,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #video {
        object-fit: fill;
      }
      #overlay {
        pointer-events: none;
      }
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
        text-align: center;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #intro {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 20px;
        padding: 32px;
        text-align: center;
        background: #0b0d10;
      }
      /* 確保 iPhone Safari 不會讓 display:grid 蓋過 hidden 屬性。 */
      #intro[hidden] {
        display: none !important;
      }
      #intro h1 {
        margin: 0;
        font-size: 20px;
      }
      #intro p {
        margin: 0;
        color: #9aa4b2;
      }
      #start {
        justify-self: center;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: #1e6fa8;
        border: 0;
        border-radius: 999px;
      }
      #start:disabled {
        opacity: 0.5;
      }
      #error {
        color: #ff9b9b;
        white-space: pre-line;
      }
    </style>
    <script type="module" crossorigin src="/Aruco/assets/main-B76nxLZb.js"></script>
    <link rel="modulepreload" crossorigin href="/Aruco/assets/renderer-DTaXpdj6.js">
  </head>
  <body>
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="hud"></div>
    <div id="intro">
      <h1>名片 AR</h1>
      <p>把鏡頭對準印好的 ArUco marker，<br />立方體會疊在 marker 上。</p>
      <button id="start">開啟相機</button>
      <p id="error"></p>
    </div>
  </body>
</html>
